Port 22
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes
AllowTcpForwarding yes
GatewayPorts clientspecified
X11Forwarding no
PrintMotd no
Subsystem sftp internal-sftp
HostKey /var/lib/workstation/ssh/ssh_host_ed25519_key
HostKey /var/lib/workstation/ssh/ssh_host_rsa_key
