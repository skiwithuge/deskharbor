[unix_http_server]
file=/run/supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[program:dbus]
autostart=%(ENV_ENABLE_DBUS)s
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:ssh]
autostart=%(ENV_ENABLE_SSH)s
command=/usr/sbin/sshd -D -e
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:pulse]
autostart=%(ENV_ENABLE_PULSE)s
command=/opt/workstation/start-pulse.sh
user=%(ENV_WORKSTATION_USER)s
environment=USER="%(ENV_WORKSTATION_USER)s",HOME="%(ENV_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
[program:audio]
autostart=%(ENV_ENABLE_AUDIO)s
command=/usr/bin/python3 /opt/workstation/audio-server.py --auth-file %(ENV_XDG_RUNTIME_DIR)s/audio-auth.json
autorestart=true
user=%(ENV_WORKSTATION_USER)s
environment=USER="%(ENV_WORKSTATION_USER)s",HOME="%(ENV_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=35
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
[program:vnc]
autostart=%(ENV_ENABLE_VNC)s
command=/opt/workstation/start-vnc.sh
user=%(ENV_WORKSTATION_USER)s
environment=USER="%(ENV_WORKSTATION_USER)s",HOME="%(ENV_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=15
[program:web]
autostart=%(ENV_ENABLE_WEB)s
command=/usr/bin/websockify --web=/opt/novnc 6080 127.0.0.1:5901
user=%(ENV_WORKSTATION_USER)s
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
